services:
  orbis:
    image: ghcr.io/orbis-hub/orbis:latest
    build: .
    container_name: orbis
    restart: unless-stopped
    # host networking: the hub must sit on your LAN to discover devices (mDNS/SSDP/ARP) and reach them directly.
    # the web UI is then at http://<host>:3001
    network_mode: host
    environment:
      PORT: "3001"
      LOG_LEVEL: info
      # extra origins allowed to call the API (e.g. a reverse-proxied domain)
      # ORBIS_CORS_ORIGINS: https://orbis.example.com
      # ORBIS_REGISTRIES: https://raw.githubusercontent.com/orbis-hub/registry/main/index.json
    volumes:
      - ./data:/data
