; orbis e-ink firmware
; one codebase, one environment per board. build: pio run -e <env>   flash: pio run -e <env> -t upload
; the web flasher at https://orbis-hub.github.io/flash takes the .bin files ci produces from these envs.

[platformio]
default_envs = waveshare-75
src_dir = src

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DORBIS_FW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.0
board_build.partitions = min_spiffs.csv

; ---------- soldered inkplate (esp32, 3-bit grayscale, 6plus has touch) ----------
[inkplate]
board = esp32dev
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
lib_deps =
  ${env.lib_deps}
  https://github.com/SolderedElectronics/Inkplate-Arduino-library.git

[env:inkplate6]
extends = inkplate
build_flags = ${env.build_flags} -DARDUINO_ESP32_DEV -DARDUINO_INKPLATE6V2 -DORBIS_BOARD=\"inkplate6\" -DORBIS_W=800 -DORBIS_H=600 -DORBIS_GRAY=3

[env:inkplate6plus]
extends = inkplate
build_flags = ${env.build_flags} -DARDUINO_ESP32_DEV -DARDUINO_INKPLATE6PLUSV2 -DORBIS_BOARD=\"inkplate6plus\" -DORBIS_W=1024 -DORBIS_H=758 -DORBIS_GRAY=3 -DORBIS_TOUCH_INKPLATE

[env:inkplate10]
extends = inkplate
build_flags = ${env.build_flags} -DARDUINO_ESP32_DEV -DARDUINO_INKPLATE10V2 -DORBIS_BOARD=\"inkplate10\" -DORBIS_W=1200 -DORBIS_H=825 -DORBIS_GRAY=3

[env:inkplate6color]
extends = inkplate
build_flags = ${env.build_flags} -DARDUINO_ESP32_DEV -DARDUINO_INKPLATECOLOR -DORBIS_BOARD=\"inkplate6color\" -DORBIS_W=600 -DORBIS_H=448 -DORBIS_GRAY=1

; ---------- lilygo t5 4.7" (ed047tc1, 16 gray). plain = esp32 wrover, s3 = esp32-s3 with touch ----------
[env:lilygo-t5-47]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -DORBIS_BOARD=\"lilygo-t5-47\" -DORBIS_W=960 -DORBIS_H=540 -DORBIS_GRAY=4 -DORBIS_EPD47
lib_deps =
  ${env.lib_deps}
  https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git

[env:lilygo-t5-47-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DORBIS_BOARD=\"lilygo-t5-47-s3\" -DORBIS_W=960 -DORBIS_H=540 -DORBIS_GRAY=4 -DORBIS_EPD47 -DORBIS_TOUCH_I2C -DORBIS_SDA=18 -DORBIS_SCL=17 -DORBIS_TOUCH_INT=47
lib_deps =
  ${env.lib_deps}
  https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git

; ---------- waveshare panels on the waveshare esp32 e-paper driver board (gxepd2) ----------
[waveshare]
board = esp32dev
lib_deps =
  ${env.lib_deps}
  zinggjm/GxEPD2@^1.6.1
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit BusIO@^1.16.1

[env:waveshare-75]
extends = waveshare
build_flags = ${env.build_flags} -DORBIS_BOARD=\"waveshare-75\" -DORBIS_W=800 -DORBIS_H=480 -DORBIS_GRAY=1 -DORBIS_GXEPD2 -DORBIS_GX_CLASS=GxEPD2_750_T7

[env:waveshare-42]
extends = waveshare
build_flags = ${env.build_flags} -DORBIS_BOARD=\"waveshare-42\" -DORBIS_W=400 -DORBIS_H=300 -DORBIS_GRAY=1 -DORBIS_GXEPD2 -DORBIS_GX_CLASS=GxEPD2_420

[env:waveshare-29]
extends = waveshare
build_flags = ${env.build_flags} -DORBIS_BOARD=\"waveshare-29\" -DORBIS_W=296 -DORBIS_H=128 -DORBIS_GRAY=1 -DORBIS_GXEPD2 -DORBIS_GX_CLASS=GxEPD2_290_T94
